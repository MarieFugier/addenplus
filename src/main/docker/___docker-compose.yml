version: '2'

services:
  app:
    image: 'docker-spring-boot-postgres:latest'
    build:
      context: .
    container_name: api
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
          
  db:
    image: 'postgres:13.1-alpine'
    container_name: db
    environment:
      - POSTGRES_USER=hibernate1
      - POSTGRES_PASSWORD=123456

  db2:
    image: 'postgres:13.1-alpine'
    container_name: db2
    environment:
      - POSTGRES_USER=hibernate2
      - POSTGRES_PASSWORD=123456
