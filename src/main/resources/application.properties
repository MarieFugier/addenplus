spring.application.name=api

spring.datasource.url.1=jdbc:sqlserver://localhost:1433;databaseName=hibernate1;encrypt=true;trustServerCertificate=true;
spring.datasource.username.1=root
spring.datasource.password.1=
spring.datasource.driver.1=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.url.2=jdbc:sqlserver://localhost:1433;databaseName=hibernate2;encrypt=true;trustServerCertificate=true;
spring.datasource.username.2=root
spring.datasource.password.2=
spring.datasource.driver.2=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
database.hibernate.schema_update = update
database.hibernate.dialect = org.hibernate.dialect.SQLServerDialect
database.hibernate.show_sql = true
database.hibernate.format_sql = true

server.port=8080

# App Properties
addenplus.app.jwtSecret= ======================AddenPlus=Spring===========================
addenplus.app.jwtExpirationMs=86400000

# Activation du profile Spring
# Windows => set SPRING_PROFILES_ACTIVE=dev
# Linux   => export SPRING_PROFILES_ACTIVE=dev
